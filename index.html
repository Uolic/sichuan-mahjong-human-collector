<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>四川麻将出牌采集</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261121-5">
</head>
<body>
  <main id="app">
    <section id="welcome" class="screen active">
      <div class="hero welcome-hero">
        <div class="hero-seal">川</div>
        <span class="eyebrow">匿名真人出牌采集</span>
        <h1>坐上来，<br>帮我打一手牌</h1>
        <p>像真打麻将一样看牌河、副露和手牌。每轮 20 手，点一张你认为该打出的牌。</p>
        <div class="hero-tiles" aria-hidden="true">
          <img class="hero-tile" src="tiles_cn/w5.jpg?v=20261121-5" alt="">
          <img class="hero-tile" src="tiles_cn/t7.jpg?v=20261121-5" alt="">
          <img class="hero-tile" src="tiles_cn/b5.jpg?v=20261121-5" alt="">
        </div>
      </div>
      <div class="card welcome-card">
        <div class="quick-facts">
          <span><b>20</b> 手结束</span>
          <span><b>0</b> 安装</span>
          <span><b>匿名</b> 不登录</span>
        </div>
        <label class="field">
          <span>你的麻将经验</span>
          <select id="experience">
            <option value="beginner">刚开始学</option>
            <option value="intermediate" selected>会打，但不熟练</option>
            <option value="advanced">经常打、比较熟练</option>
          </select>
        </label>
        <label class="consent">
          <input type="checkbox" id="consent">
          <span>我知道只记录手牌、选择、思考时间和对局信息；不会收集姓名、手机号或位置。</span>
        </label>
        <button id="start" class="primary needs-consent">入座，开始 20 手</button>
        <p id="startStatus" class="start-status" aria-live="polite"></p>
        <p class="privacy">匿名编号：<b id="collectorId"></b></p>
      </div>
    </section>

    <section id="quiz" class="screen">
      <header class="game-hud">
        <button id="exit" class="icon-button" aria-label="退出本轮">×</button>
        <div class="round-copy">
          <span>川麻 · 血战到底</span>
          <h2 id="progressTitle">第 1 / 20 手</h2>
        </div>
        <div class="wall-counter" title="剩余牌墙">
          <b id="wallRemaining">--</b>
          <span>余牌</span>
        </div>
      </header>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="info-row" id="meta"></div>

      <section class="table-shell" aria-label="麻将牌桌">
        <div class="table-rim">
          <div class="table-felt">
            <div class="felt-glow" aria-hidden="true"></div>
            <div id="tableInfo" class="table-players"></div>
          </div>
        </div>
      </section>

      <section class="hand-dock">
        <div class="turn-line">
          <div class="turn-copy">
            <span class="turn-dot"></span>
            <b>轮到你出牌</b>
          </div>
          <span id="selectedLabel" aria-live="polite">点一张手牌</span>
        </div>
        <div id="myMelds" class="my-melds"></div>
        <div id="hand" class="hand" aria-label="你的手牌"></div>
        <p class="play-hint">点牌选择，拖动可整理顺序 · 红点表示定缺牌</p>
        <div class="actions">
          <button id="skip" class="ghost">这手不确定</button>
          <button id="confirm" class="primary discard-button" disabled>打出这张</button>
        </div>
      </section>
    </section>

    <section id="done" class="screen">
      <div class="hero small done-hero">
        <span class="eyebrow">采集完成</span>
        <h1>这一桌，打完了</h1>
        <p id="doneText">正在提交匿名数据……</p>
      </div>
      <div class="card done-card">
        <div class="summary" id="summary"></div>
        <button id="download" class="primary hidden">下载并分享结果</button>
        <button id="again" class="ghost">再答一轮</button>
      </div>
    </section>
  </main>
  <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="polite">
    <div class="loading-card">
      <span class="loading-tile" aria-hidden="true">東</span>
      <strong id="loadingTitle">正在洗牌</strong>
      <span id="loadingText">第一次进入需要准备牌桌，请稍等几秒。</span>
    </div>
  </div>
  <script src="app.js?v=20261121-5"></script>
</body>
</html>
