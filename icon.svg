<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073f31"/>
      <stop offset="1" stop-color="#168161"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef7"/>
      <stop offset="1" stop-color="#eadfc5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#001d15" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <circle cx="256" cy="242" r="174" fill="none" stroke="#f6d78d" stroke-opacity=".38" stroke-width="5"/>
  <g transform="rotate(-7 256 246)" filter="url(#shadow)">
    <rect x="132" y="89" width="248" height="318" rx="34" fill="#ccb991"/>
    <rect x="132" y="76" width="248" height="318" rx="34" fill="url(#tile)" stroke="#b7a77f" stroke-width="5"/>
    <rect x="151" y="95" width="210" height="280" rx="22" fill="none" stroke="#c8b994" stroke-width="4"/>
    <text x="256" y="260" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="150" font-weight="700" fill="#b33831">川</text>
    <text x="256" y="318" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" letter-spacing="8" fill="#196b4d">出牌采集</text>
  </g>
